name: Android

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lint jest tu najważniejszym krokiem: `fatal += NewApi, InlinedApi` w build.gradle.kts
      # sprawia, że każde użycie API nowszego niż minSdk 24 bez sprawdzenia wersji
      # przerywa build. To jedyna automatyczna kontrola zgodności wstecznej.
      - name: Lint (zgodność z minSdk 24)
        run: ./gradlew lintDebug

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest

      - name: Budowa APK
        run: ./gradlew assembleDebug

      - name: Raport lintu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Raport testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-testow
          path: app/build/reports/tests/
          if-no-files-found: ignore
